<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shrink Header on Scroll — w3schools 1:1</title>
</head>
<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
}

#header {
  background-color: #f1f1f1;  /* grey background */
  padding: 50px 10px;          /* some padding */
  color: black;
  text-align: center;          /* centered text */
  font-size: 360px;            /* big font size (large so header is >500px tall) */
  font-weight: bold;
  position: fixed;             /* fixed position - sit on top of the page */
  top: 0;
  width: 100%;                 /* full width */
  transition: 0.4s;            /* add a transition effect (when scrolling - and font size is decreased) */
  box-sizing: border-box;
  z-index: 100;
}

/* Content spacing so the fixed header doesn't cover text */
.main {
  padding: 540px 20px 40px;
  max-width: 700px;
  margin: 0 auto;
  font-family: Arial, Helvetica, sans-serif;
}
.card { background:#fff; border:1px solid #ddd; padding:22px; margin-bottom:16px; }
.card p { color:#555; line-height:1.5; }
</style>
<body>

<div id="header">Header</div>

<div class="main">
  <div class="card"><h3>Scroll down 👇</h3><p>Header should shrink when you scroll past 50px, grow back at top.</p></div>
  <div class="card"><p>Content to make the page scroll.</p></div>
  <div class="card"><p>More content.</p></div>
  <div class="card"><p>More content.</p></div>
  <div class="card"><p>More content.</p></div>
  <div class="card"><p>More content.</p></div>
  <div class="card"><p>More content.</p></div>
  <div class="card"><p>The end.</p></div>
</div>

<script>
// When the user scrolls down 50px from the top of the document, resize the header's font size
window.onscroll = function() {scrollFunction()};

function scrollFunction() {
  if (document.body.scrollTop > 50 || document.documentElement.scrollTop > 50) {
    document.getElementById("header").style.fontSize = "30px";
  } else {
    document.getElementById("header").style.fontSize = "360px";
  }
}
</script>

</body>
</html>
